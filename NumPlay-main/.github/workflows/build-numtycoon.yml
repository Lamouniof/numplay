name: Build NumTycoon (.nwa)

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/numtycoon/**'
      - '.github/workflows/build-numtycoon.yml'
  pull_request:
    paths:
      - 'games/numtycoon/**'
      - '.github/workflows/build-numtycoon.yml'

permissions:
  contents: read

jobs:
  build-numtycoon:
    name: Compile NumTycoon for NumWorks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ARM GNU toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Show tool versions
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-strip --version
          node --version
          npm --version
          npx --yes -- nwlink@1.0.0 --version

      - name: Build NumTycoon
        working-directory: games/numtycoon
        run: |
          make clean
          make build Q=
          test -s output/numtycoon.nwa

      - name: Validate generated NWA
        working-directory: games/numtycoon
        run: |
          npx --yes -- nwlink@1.0.0 nwa-bin --ram-length 153676 output/numtycoon.nwa output/numtycoon.bin
          test -s output/numtycoon.bin
          echo "Generated files:"
          ls -lh output/numtycoon.nwa output/numtycoon.bin
          echo "NWA size: $(wc -c < output/numtycoon.nwa) bytes"
          echo "BIN size: $(wc -c < output/numtycoon.bin) bytes"

      - name: Upload NumTycoon.nwa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumTycoon-nwa
          path: games/numtycoon/output/numtycoon.nwa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NumTycoon-build-output
          path: games/numtycoon/output/
          if-no-files-found: ignore
          retention-days: 7
